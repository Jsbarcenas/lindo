name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  # Enable manual workflow execution for release testing.
  workflow_dispatch:

# Only the release job may write; building needs nothing.
permissions: {}

jobs:
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        # macOS builds x64 and arm64 in a single run on purpose: electron-builder
        # emits one latest-mac.yml covering both, and splitting the arches across
        # runners would produce two files with the same name that collide in the
        # release, breaking auto-update.
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # must come before setup-node so that cache: pnpm can find it.
      # the version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      - name: Build
        env:
          # consumed by apps/desktop/scripts/afterPackHook.js to report the packed asar hash
          LINDO_KEY: ${{ secrets.LINDO_KEY }}
        run: pnpm build

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          # globs rather than hardcoded names: electron-builder changes its
          # default artifact names between majors, and version interpolation
          # silently produced empty uploads when the tag and package.json drifted
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.exe.blockmap
            apps/desktop/release/*/*win.zip
            apps/desktop/release/*/latest.yml

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.dmg.blockmap
            apps/desktop/release/*/*mac.zip
            apps/desktop/release/*/*mac.zip.blockmap
            apps/desktop/release/*/latest-mac.yml

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.tar.gz
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/latest-linux.yml

  create-release:
    name: 'Upload Release'
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    # Only a tag publishes. A workflow_dispatch run exists to prove the build
    # works and stops there - without this it would cut a release named after
    # whatever branch it was fired from.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # no name: downloads every artifact, each into its own subdirectory
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # the tag that triggered the run, instead of re-reading package.json:
          # a mismatch between the two used to publish a differently named release
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          # NOTE: electron-updater cannot see draft releases. The release has to
          # be published by hand before existing installs are offered the update.
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*/*
