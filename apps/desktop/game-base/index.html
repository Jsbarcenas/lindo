<!DOCTYPE HTML>
<html lang="fr">
    <head>
        <!-- Must be loaded, not inlined, and before anything else runs: the
             installer is applied to every realm the page creates, so it has to
             exist before the first one does. -->
        <script src="platform.js"></script>
        <script>
        // Touch fix
        window.ontouchstart = function(e) {};

        // ---------------------------------------------------------------
        // Platform identity.
        //
        // Runs before build/script.js is appended by initDofus, so it is all in
        // place by the time the bundle reads any of it.
        //
        // The User-Agent alone does not decide the platform. The bundle resolves
        // it as `window.device.platform || UAParser(navigator.userAgent)` and,
        // separately, `navigator.userAgentData` reports the real host OS to
        // anything that asks. Setting only some of these is worse than setting
        // none: the disagreement between them is itself the signal.
        //
        // Every value comes from the profile the main process built, so the
        // frame and the request headers describe the same device.
        // ---------------------------------------------------------------
        var androidProfile = (window.top && window.top.androidProfile) || {
            // only reached if the renderer failed to publish one; keeps the
            // frame coherent instead of half-overridden
            androidVersion: "14",
            chromeVersion: "138.0.7204.157",
            chromeMajor: "138",
            model: "Pixel 7",
            manufacturer: "Google",
            navigatorPlatform: "Linux armv8l",
            glVendor: "ARM",
            glRenderer: "Mali-G710 MC10",
            cores: 8,
            memory: 8
        };
        androidProfile.uuid = (window.top && window.top.key)
            ? String(window.top.key).slice(0, 16)
            : "0123456789abcdef";

        // The real client appends its own product token, and the desktop build
        // does the same when it sets the session User-Agent. The browser build
        // has no session to set, so the string platform.js installs has to
        // arrive complete - otherwise the two builds name the same device with
        // two different strings, which is its own kind of tell.
        if (androidProfile.userAgent && window.top.appVersion &&
            androidProfile.userAgent.indexOf("DofusTouch Client") === -1) {
            androidProfile.userAgent += " DofusTouch Client " + window.top.appVersion;
        }

        // ---------------------------------------------------------------
        // Dentro de la app: el aparato responde solo.
        //
        // `apps/lindo-mobile` publica lo que dice `expo-device` antes de que
        // cargue el documento. Cuando eso existe, el perfil sintético deja de
        // ser la fuente y pasa a ser el respaldo: lo que se instala describe el
        // teléfono real, que es además el que emite las cabeceras. Inventar aquí
        // un SM-A546B contradiría su propio User-Agent.
        //
        // La GPU es la excepción, y solo en emulador: ahí no se reporta una GPU
        // de Android sino la del anfitrión - "Apple M4 Max" en un Mac -, que no
        // es una respuesta honesta sino otra mentira, y peor.
        // ---------------------------------------------------------------
        var nativeInfo = window.top.lindoNative;
        if (nativeInfo && nativeInfo.device) {
            androidProfile.androidVersion = nativeInfo.device.version;
            androidProfile.model = nativeInfo.device.model;
            androidProfile.manufacturer = nativeInfo.device.manufacturer;
            androidProfile.uuid = nativeInfo.device.uuid;
            androidProfile.cordova = nativeInfo.device.cordova;
            androidProfile.isVirtual = nativeInfo.device.isVirtual;
        }

        var platformOptions = nativeInfo
            ? { nativeAndroid: true, spoofGpu: nativeInfo.isEmulator }
            : undefined;

        window.installLindoPlatform(window, androidProfile, platformOptions);

        // The renderer hosting this frame is reachable from inside it - the
        // bundle itself uses `top.console` and `window.top.FileLoggerLib - so
        // `top.navigator.platform` was still answering with the host. Its input
        // traits are left alone: that window draws the React interface, which
        // lays itself out from pointer and hover queries.
        try {
            if (window.top !== window) {
                window.top.installLindoPlatform =
                    window.top.installLindoPlatform || window.installLindoPlatform;
                window.installLindoPlatform(window.top, androidProfile, {
                    inputTraits: false,
                    cordovaSurface: false,
                    nativeAndroid: !!nativeInfo,
                    spoofGpu: !!nativeInfo && nativeInfo.isEmulator
                });
            }
        } catch (e) {
            top.console.log("lindo: could not install platform on the parent", e);
        }

        // Init
        window.buildVersion = window.top.buildVersion;
        window.appVersion = window.top.appVersion;
        window.appInfo = {
            version: window.top.appVersion
        };

        window._ = {
            appVersion: window.appVersion,
            buildVersion: window.buildVersion,
            client: "android"
        };

        window.indexedDB = {};
        window.IDBDatabase = {};
        window.IDBTransaction = {};
        window.IDBCursor = {};
        window.IDBKeyRange = {};

        // installLindoPlatform sets window.device; these are the plugin surfaces
        // the bundle calls into, which the device object does not cover
        // The official Android client exposes exactly Keyboard, Yanap,
        // browsertab and screenorientation here. `isemulator` was not one of
        // them and the bundle never calls it, so it only ever marked this build
        // as something other than the real client.
        //
        // The three that are missing are deliberate: the bundle calls them
        // behind a presence check and has working fallbacks, so a stub that
        // answers but does nothing would take audio and orientation down a path
        // that then fails. Absent beats broken.
        window.cordova = {
            plugins: {
                Keyboard: {
                    close: function() {},
                    disableScroll: function() {},
                    show: function() {},
                    hideKeyboardAccessoryBar: function() {}
                },
                // Present because the official client has it, and safe to
                // answer because locking orientation in a desktop window is a
                // no-op by nature: the calls succeed and nothing depended on
                // them doing anything. Yanap and browsertab are deliberately
                // still absent - those two the bundle would actually use, for
                // audio and for the login tab, and a stub that answers without
                // working would break both.
                screenorientation: {
                    type: "portrait-primary",
                    angle: 0,
                    lock: function(orientation, success) { if (success) success(); },
                    unlock: function(success) { if (success) success(); },
                    setOrientation: function(orientation, success) { if (success) success(); }
                }
                // `notification` used to sit here. The official client has no
                // such plugin and the bundle never reads
                // cordova.plugins.notification - the word appears 24 times, but
                // as navigator.notification and in unrelated code - so all it
                // did was advertise a plugin no real client ships.
            }
        };

        // The official client installs these under window.plugins, not under
        // cordova.plugins, and that is where the bundle looks for them.
        window.plugins = window.plugins || {};
        window.plugins.pushNotification = window.plugins.pushNotification || {
            onDeviceReady: function() {},
            setUserId: function() {},
            registerDevice: function() {}
        };

        // Which login flow the patched bundle takes.
        //
        // Ankama ships two: a deep link to dofustouch://authorized, which only
        // an app that owns the scheme can catch, and a plain browser redirect
        // that comes back with ?code= in the URL. The Electron build intercepts
        // the first one; a page cannot, so the browser build has to use the
        // second - and the redirect has to land on this origin rather than
        // Ankama's, or the code arrives somewhere we cannot read it.
        //
        // The web host sets these two on its own window; Electron never does, so
        // it keeps the bridge. `lindoOpenWebAuth` is no good as the
        // discriminator because GameScreen installs it in both builds, and
        // `window.top.platform` is no good either - nothing has ever set it.
        window.lindoBrowserAuth = window.top.lindoBrowserAuth === true;

        // Haapi has to be reached through this origin, not directly.
        //
        // Ankama's preflight answers with `access-control-request-headers` - a
        // *request* header name - instead of `Access-Control-Allow-Headers`, so
        // the browser never sees `apikey` allowed and blocks the account call
        // that follows a successful login. Nothing on this side can fix that;
        // the same-origin path in front of a proxy can, and Electron is
        // unaffected because it is not subject to CORS at all.
        if (window.lindoBrowserAuth) {
            (function () {
                var HAAPI = "https://haapi.ankama.com/";
                var nativeFetch = window.fetch;
                window.fetch = function (input, init) {
                    try {
                        var url = typeof input === "string" ? input : input && input.url;
                        if (url && url.indexOf(HAAPI) === 0) {
                            var proxied = "/haapi/" + url.slice(HAAPI.length);
                            input = typeof input === "string" ? proxied : new Request(proxied, input);
                        }
                    } catch (e) {
                        top.console.log("lindo: no se pudo redirigir una petición a haapi", e);
                    }
                    return nativeFetch.call(this, input, init);
                };
            })();
        }

        if (window.top.platform == "darwin") {
            (function() {
                window.requestAnimationFrame = function(callback) {
                    var self = requestAnimationFrame;
                    self.queue.push(callback);
                    if (!self.timeout) {
                        self.timeout = setTimeout(function() {
                            var queue = self.queue;
                            self.queue = [];
                            self.timeout = null;
                            queue.forEach(function(q) {
                                q();
                            });
                        }, 16);
                    }
                };
                requestAnimationFrame.queue   = [];
                requestAnimationFrame.timeout = null;
            })();
        }

        window.initDofus = function(cb) {
            var head = document.getElementsByTagName('head')[0];

            var scriptScript = document.createElement('script');
            scriptScript.addEventListener('load', function() {
                var fixesScript = document.createElement('script');
                fixesScript.src = 'fixes.js';
                head.appendChild(fixesScript);
                cb();
            });
            scriptScript.src = 'build/script.js';
            head.appendChild(scriptScript);
        };

    </script>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="build/styles-native.css" />
        <link rel="stylesheet" href="fixes.css" />
    </head>
    <body>
    </body>
    <!-- Dependencies -->
    <script src="keymaster2.js"></script>
</html>
