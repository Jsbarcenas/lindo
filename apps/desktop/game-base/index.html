<!DOCTYPE HTML>
<html lang="fr">
    <head>
        <!-- Must be loaded, not inlined, and before anything else runs: the
             installer is applied to every realm the page creates, so it has to
             exist before the first one does. -->
        <script src="platform.js"></script>
        <script>
        // Touch fix
        window.ontouchstart = function(e) {};

        // ---------------------------------------------------------------
        // Platform identity.
        //
        // Runs before build/script.js is appended by initDofus, so it is all in
        // place by the time the bundle reads any of it.
        //
        // The User-Agent alone does not decide the platform. The bundle resolves
        // it as `window.device.platform || UAParser(navigator.userAgent)` and,
        // separately, `navigator.userAgentData` reports the real host OS to
        // anything that asks. Setting only some of these is worse than setting
        // none: the disagreement between them is itself the signal.
        //
        // Every value comes from the profile the main process built, so the
        // frame and the request headers describe the same device.
        // ---------------------------------------------------------------
        var androidProfile = (window.top && window.top.androidProfile) || {
            // only reached if the renderer failed to publish one; keeps the
            // frame coherent instead of half-overridden
            androidVersion: "14",
            chromeVersion: "138.0.7204.157",
            chromeMajor: "138",
            model: "Pixel 7",
            manufacturer: "Google",
            navigatorPlatform: "Linux armv8l",
            glVendor: "ARM",
            glRenderer: "Mali-G710 MC10",
            cores: 8,
            memory: 8
        };
        androidProfile.uuid = (window.top && window.top.key)
            ? String(window.top.key).slice(0, 16)
            : "0123456789abcdef";

        window.installLindoPlatform(window, androidProfile);

        // The renderer hosting this frame is reachable from inside it - the
        // bundle itself uses `top.console` and `window.top.FileLoggerLib - so
        // `top.navigator.platform` was still answering with the host. Its input
        // traits are left alone: that window draws the React interface, which
        // lays itself out from pointer and hover queries.
        try {
            if (window.top !== window) {
                window.top.installLindoPlatform =
                    window.top.installLindoPlatform || window.installLindoPlatform;
                window.installLindoPlatform(window.top, androidProfile, { inputTraits: false });
            }
        } catch (e) {
            top.console.log("lindo: could not install platform on the parent", e);
        }

        // Init
        window.buildVersion = window.top.buildVersion;
        window.appVersion = window.top.appVersion;
        window.appInfo = {
            version: window.top.appVersion
        };

        window._ = {
            appVersion: window.appVersion,
            buildVersion: window.buildVersion,
            client: "android"
        };

        window.indexedDB = {};
        window.IDBDatabase = {};
        window.IDBTransaction = {};
        window.IDBCursor = {};
        window.IDBKeyRange = {};

        // installLindoPlatform sets window.device; these are the plugin surfaces
        // the bundle calls into, which the device object does not cover
        // The official Android client exposes exactly Keyboard, Yanap,
        // browsertab and screenorientation here. `isemulator` was not one of
        // them and the bundle never calls it, so it only ever marked this build
        // as something other than the real client.
        //
        // The three that are missing are deliberate: the bundle calls them
        // behind a presence check and has working fallbacks, so a stub that
        // answers but does nothing would take audio and orientation down a path
        // that then fails. Absent beats broken.
        window.cordova = {
            plugins: {
                Keyboard: {
                    close: function() {},
                    disableScroll: function() {},
                    show: function() {},
                    hideKeyboardAccessoryBar: function() {}
                },
                // Present because the official client has it, and safe to
                // answer because locking orientation in a desktop window is a
                // no-op by nature: the calls succeed and nothing depended on
                // them doing anything. Yanap and browsertab are deliberately
                // still absent - those two the bundle would actually use, for
                // audio and for the login tab, and a stub that answers without
                // working would break both.
                screenorientation: {
                    type: "portrait-primary",
                    angle: 0,
                    lock: function(orientation, success) { if (success) success(); },
                    unlock: function(success) { if (success) success(); },
                    setOrientation: function(orientation, success) { if (success) success(); }
                },
                notification: {
                    local: false
                }
            }
        };

        // The official client installs these under window.plugins, not under
        // cordova.plugins, and that is where the bundle looks for them.
        window.plugins = window.plugins || {};
        window.plugins.pushNotification = window.plugins.pushNotification || {
            onDeviceReady: function() {},
            setUserId: function() {},
            registerDevice: function() {}
        };

        if (window.top.platform == "darwin") {
            (function() {
                window.requestAnimationFrame = function(callback) {
                    var self = requestAnimationFrame;
                    self.queue.push(callback);
                    if (!self.timeout) {
                        self.timeout = setTimeout(function() {
                            var queue = self.queue;
                            self.queue = [];
                            self.timeout = null;
                            queue.forEach(function(q) {
                                q();
                            });
                        }, 16);
                    }
                };
                requestAnimationFrame.queue   = [];
                requestAnimationFrame.timeout = null;
            })();
        }

        window.initDofus = function(cb) {
            var head = document.getElementsByTagName('head')[0];

            var scriptScript = document.createElement('script');
            scriptScript.addEventListener('load', function() {
                var fixesScript = document.createElement('script');
                fixesScript.src = 'fixes.js';
                head.appendChild(fixesScript);
                cb();
            });
            scriptScript.src = 'build/script.js';
            head.appendChild(scriptScript);
        };

    </script>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="build/styles-native.css" />
        <link rel="stylesheet" href="fixes.css" />
    </head>
    <body>
    </body>
    <!-- Dependencies -->
    <script src="keymaster2.js"></script>
</html>
